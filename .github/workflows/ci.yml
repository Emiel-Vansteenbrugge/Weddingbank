name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore src/backend/WeddingBank.slnx

      - name: Build
        run: dotnet build src/backend/WeddingBank.slnx --no-restore -c Release

      - name: Test
        run: dotnet test src/backend/WeddingBank.slnx --no-build -c Release

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  deploy-scripts:
    name: Deploy scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check deploy scripts
        run: bash infra/deploy/test-deploy-scripts.sh

      - name: Render server compose file
        run: docker compose -f infra/compose/docker-compose.yml --env-file infra/compose/env/ci.env config >/dev/null

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [backend, frontend, deploy-scripts]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Image prefix
        id: image
        run: |
          repository="$(printf '%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "prefix=ghcr.io/${repository%/*}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Build images
        id: build
        env:
          PREFIX: ${{ steps.image.outputs.prefix }}
          PUBLISH: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main') }}
        run: |
          set -euo pipefail
          tag_for() {
            printf '%s/weddingbank-%s:sha-%s\n' "$PREFIX" "$1" "$GITHUB_SHA"
          }
          api_tag="$(tag_for api)"
          web_tag="$(tag_for web)"
          proxy_tag="$(tag_for proxy)"
          docker build -f infra/docker/api.Dockerfile -t "$api_tag" .
          docker build -f infra/docker/web.Dockerfile -t "$web_tag" .
          docker build -f infra/docker/proxy.Dockerfile -t "$proxy_tag" .
          docker run --rm "$proxy_tag" nginx -t
          if [[ "$PUBLISH" != "true" ]]; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          docker push "$api_tag"
          docker push "$web_tag"
          docker push "$proxy_tag"
          digest_for() {
            docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$1" \
              | grep -F '@sha256:' \
              | head -n 1
          }
          jq -n \
            --arg sha "$GITHUB_SHA" \
            --arg api "$(digest_for "$api_tag")" \
            --arg web "$(digest_for "$web_tag")" \
            --arg proxy "$(digest_for "$proxy_tag")" \
            '{schema: 1, sha: $sha, images: {api: $api, web: $web, proxy: $proxy}}' > release-manifest.json
          bash infra/deploy/weddingbank-agent.sh --validate-manifest release-manifest.json
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Publish release manifest
        if: steps.build.outputs.published == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: release-manifest.json
          retention-days: 90
          if-no-files-found: error
