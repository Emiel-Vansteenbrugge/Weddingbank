name: Deploy production

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Commit op main. Leeg betekent de tip van main.
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  approve:
    name: Register approval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Production approval can only be registered from main." >&2
          exit 1

      - name: Verify commit and CI
        id: approval
        env:
          REQUESTED_SHA: ${{ inputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="${REQUESTED_SHA:-$GITHUB_SHA}"
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The SHA must be the full 40-character commit id." >&2
            exit 1
          fi
          git fetch origin main
          git merge-base --is-ancestor "$sha" origin/main
          run_id="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${sha}&event=push&status=success&per_page=5" \
            --jq '[.workflow_runs[] | select(.head_branch == "main")][0].id')"
          if [[ -z "$run_id" || "$run_id" == "null" ]]; then
            echo "No successful CI run on main for ${sha}." >&2
            exit 1
          fi
          echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Download CI manifest
        uses: actions/download-artifact@v4
        with:
          name: release-manifest
          run-id: ${{ steps.approval.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Write approval record
        env:
          SHA: ${{ steps.approval.outputs.sha }}
        run: |
          set -euo pipefail
          manifest_sha="$(jq -r '.sha' release-manifest.json)"
          if [[ "$manifest_sha" != "$SHA" ]]; then
            echo "The CI manifest belongs to ${manifest_sha}, not ${SHA}." >&2
            exit 1
          fi
          jq --arg sha "$SHA" '. + {environment: "production", sha: $sha}' release-manifest.json > production-approval.json
          bash infra/deploy/weddingbank-agent.sh --validate-approval production-approval.json

      - name: Publish approval
        uses: actions/upload-artifact@v4
        with:
          name: production-approval
          path: production-approval.json
          retention-days: 90
          if-no-files-found: error

      - name: Summarize
        run: |
          {
            echo "Approval recorded for \`${{ steps.approval.outputs.sha }}\`."
            echo "This workflow does not connect to the server. The pull-agent deploys the approved image digests."
          } >> "$GITHUB_STEP_SUMMARY"
