map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

# NPM replaces X-Forwarded-For with one client address.
# A comma means the header is a chain, so it is ignored.
map $http_x_forwarded_for $forwarded_for_client {
    default $remote_addr;
    "~^[0-9a-fA-F:.]+$" $http_x_forwarded_for;
}

map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    "https" "https";
    "http" "http";
}

server {
    listen 8080;
    server_name _;

    resolver 127.0.0.11 ipv6=off valid=10s;

    location = /health {
        set $api_upstream api:8080;
        proxy_pass http://$api_upstream/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $forwarded_for_client;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /api/ {
        set $api_upstream api:8080;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $forwarded_for_client;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /hubs {
        set $api_upstream api:8080;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $forwarded_for_client;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 3600s;
    }

    location / {
        set $web_upstream web:80;
        proxy_pass http://$web_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $forwarded_for_client;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}
